# Breakout — CANDIDATE Compose file (Trading Copilot, Release 1).
# Not started by this change. Operate only through scripts/breakoutctl, which
# pins --project-directory /docker/breakout and -p breakout.
#
# Isolation: no external/production networks, no host networking, loopback-only
# port, a Breakout-owned named volume. Nothing here reaches TradeOS, OpenAlgo
# or Collector; those integrations are disabled (see docs/architecture).
name: breakout

services:
  copilot:
    build: .
    image: ${BREAKOUT_IMAGE:-breakout-copilot:candidate}   # breakout-cd sets breakout-copilot:<commit12>
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed for the container; .env cannot move these.
      BREAKOUT_HTTP_BIND: 0.0.0.0
      BREAKOUT_HTTP_PORT: "8787"
      BREAKOUT_DB_PATH: /data/breakout.db
      BREAKOUT_STATIC_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:${BREAKOUT_HOST_PORT:?set BREAKOUT_HOST_PORT in .env}:8787"
    volumes:
      - copilot_data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Read-only OpenAlgo market-data adapter. OPT-IN: started only with
  # `--profile adapter`. It holds the only OpenAlgo key (its own env file,
  # adapter.env, never .env). It is on no network that reaches OpenAlgo until
  # that network attachment is separately approved; until then market data
  # stays "not connected" in Breakout.
  adapter:
    profiles: ["adapter"]
    build: { context: ., dockerfile: adapter/Dockerfile }
    image: ${BREAKOUT_ADAPTER_IMAGE:-breakout-adapter:candidate}
    restart: unless-stopped
    env_file: adapter.env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  copilot_data: {}
